name: E2E Monitor STAC (dev)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests opentelemetry-sdk opentelemetry-exporter-otlp-proto-http

      - name: Configure environment
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/scripts" >> $GITHUB_ENV
          echo "STAC_URL=https://dev.stac.eodc.eu/api/v1"              >> $GITHUB_ENV
          echo "BROWSER_URL=https://dev.services.eodc.eu/browser"   >> $GITHUB_ENV
          echo "E2E_ENV=dev"                                          >> $GITHUB_ENV
          echo "https://otel.observability.eodc.eu/v1/metrics" >> $GITHUB_ENV
          echo "OTEL_API_KEY=${{ secrets.OTEL_API_KEY }}"           >> $GITHUB_ENV

      - name: Restore last state
        uses: actions/cache@v4
        with:
          path: .stac_last_state
          key: stac-dev-state-${{ github.run_id }}
          restore-keys: stac-dev-state-

      - name: Read last state
        id: last_state
        run: |
          if [ -f .stac_last_state ]; then
            echo "last=$(cat .stac_last_state)" >> $GITHUB_OUTPUT
          else
            echo "last=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Run availability probes
        id: monitor
        run: python scripts/test_stac_availability.py
        continue-on-error: true

      - name: Save current state
        run: echo "${{ steps.monitor.outcome }}" > .stac_last_state

      - name: Trigger GitLab remediation (first failure)
        if: steps.monitor.outcome == 'failure' && steps.last_state.outputs.last != 'failure'
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
          GITLAB_REF: ${{ secrets.GITLAB_REF }}
          GITLAB_JOB_NAME: ansible-dev
        run: python scripts/trigger_gitlab_pipeline.py
